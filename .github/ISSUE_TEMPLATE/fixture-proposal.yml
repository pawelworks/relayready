name: Fixture proposal
description: Propose a deterministic Relay Bench fixture.
title: "[Fixture]: "
labels: [benchmark, fixture]
body:
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [code, knowledge]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and checkpoint
    validations:
      required: true
  - type: textarea
    id: traps
    attributes:
      label: At least three deterministic traps
    validations:
      required: true
  - type: textarea
    id: grader
    attributes:
      label: Deterministic grading approach
    validations:
      required: true

