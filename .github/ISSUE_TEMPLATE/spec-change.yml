name: Specification change
description: Start the required public proposal process for a normative change.
title: "[Spec]: "
labels: [specification]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Normative proposal
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Specification proposals remain open for at least two weeks and require a version decision."

