name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict
      - run: pytest
      - run: node --check out/app.js
      - run: node --check out/workbench.js
      - run: node --check out/workbench-engine.mjs
      - run: node tools/test_site.mjs
      - run: node tools/test_workbench.mjs
      - run: python tools/generate_continuation_fixtures.py --check
      - run: relayready lint HANDOFF.md --check-pointers
      - run: python tools/lint_valid_examples.py
      - run: python tools/generate_rule_docs.py --check
      - run: python tools/generate_bench_fixtures.py
      - run: relayready bench verify-mock
      - run: relayready bench report
      - run: stafeta --help
      - run: mkdocs build --strict
      - run: python -m build
      - run: python tools/package_contribution.py
