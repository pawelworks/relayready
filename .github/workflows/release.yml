name: Build release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag does not match package version'"
      - run: python -m build
      - run: python tools/package_contribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/relayready-*.whl
            dist/relayready-*.tar.gz
            dist/relayready-contribution-*.zip
          if-no-files-found: error
      - name: Publication is owner-controlled
        run: >-
          python -c "print('Artifacts built only; this workflow does not publish to PyPI.')"
